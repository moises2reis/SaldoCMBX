<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="4" stroke-opacity="0.6" />

  <!-- Inner ambient circle -->
  <circle cx="256" cy="256" r="170" fill="#0f172a" stroke="#334155" stroke-width="3" stroke-opacity="0.4" />

  <!-- Bank / Vault Icon with Emerald Gradient -->
  <g filter="url(#shadow)" fill="url(#glow)">
    <!-- Roof / Pediment -->
    <polygon points="256,125 385,195 127,195" />
    <!-- Top architrave -->
    <rect x="135" y="205" width="242" height="18" rx="5" />
    <!-- Pillars -->
    <rect x="150" y="235" width="34" height="120" rx="8" />
    <rect x="204" y="235" width="34" height="120" rx="8" />
    <rect x="274" y="235" width="34" height="120" rx="8" />
    <rect x="328" y="235" width="34" height="120" rx="8" />
    <!-- Base -->
    <rect x="127" y="365" width="258" height="22" rx="6" />
    <rect x="115" y="392" width="282" height="16" rx="5" />
  </g>

  <!-- Glowing Dollar / Currency Token Sparkle -->
  <circle cx="256" cy="168" r="12" fill="#34d399" />
</svg>
